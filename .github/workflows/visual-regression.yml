name: Visual Regression Tests

on:
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'packages/ui/**'

jobs:
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Start web server
        run: pnpm --filter web run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run visual regression tests
        run: pnpm --filter web run test:visual
        continue-on-error: true
        id: visual-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 30

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: apps/web/test-results/**/*-diff.png
          retention-days: 30

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const testsPassed = '${{ steps.visual-tests.outcome }}' === 'success';
            
            let comment = '## 📸 Visual Regression Test Results\n\n';
            
            if (testsPassed) {
              comment += '✅ All visual regression tests passed!\n\n';
              comment += 'No visual changes detected.';
            } else {
              comment += '❌ Visual regression tests failed!\n\n';
              comment += 'Visual changes detected. Please review the screenshot diffs in the artifacts.\n\n';
              comment += '**Actions:**\n';
              comment += '1. Download artifacts to see diffs\n';
              comment += '2. If changes are intentional, update snapshots:\n';
              comment += '   ```bash\n';
              comment += '   pnpm --filter web run test:visual:update\n';
              comment += '   git add apps/web/e2e/**/*.png\n';
              comment += '   git commit -m "test: update visual regression snapshots"\n';
              comment += '   ```\n';
              comment += '3. If changes are unintentional, fix the CSS/layout';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if tests failed
        if: steps.visual-tests.outcome == 'failure'
        run: exit 1

