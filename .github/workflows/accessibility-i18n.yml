name: Accessibility & I18n Checks

on:
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/messages/**'
      - 'apps/web/.eslintrc.json'
      - 'apps/web/package.json'

jobs:
  accessibility-lint:
    name: Accessibility Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint with jsx-a11y rules
        run: pnpm --filter web run lint
        continue-on-error: false

  i18n-coverage:
    name: I18n Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check i18n coverage
        run: |
          cd apps/web
          node scripts/check-i18n-coverage.js

      - name: Comment PR with i18n coverage
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **I18n Coverage Check Failed**\n\nPlease ensure all translation keys are present in both `ru.json` and `uz.json`.\n\nRun `pnpm --filter web run check:i18n` locally to see details.'
            })

