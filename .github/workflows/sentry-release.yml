name: Sentry Release

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  create-sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for commit tracking

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sentry CLI
        run: npm install -g @sentry/cli

      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: studentdeals
          SENTRY_PROJECT: studentdeals-uz
        run: |
          # Get release version from git commit SHA
          VERSION=${{ github.sha }}
          
          echo "Creating Sentry release: $VERSION"
          
          # Create release
          sentry-cli releases new $VERSION
          
          # Associate commits with release
          sentry-cli releases set-commits $VERSION --auto
          
          # Finalize release
          sentry-cli releases finalize $VERSION
          
          echo "✅ Sentry release created: $VERSION"

      - name: Deploy notification
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: studentdeals
          SENTRY_PROJECT: studentdeals-uz
        run: |
          VERSION=${{ github.sha }}
          ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          
          echo "Marking release $VERSION as deployed to $ENVIRONMENT"
          
          sentry-cli releases deploys $VERSION new -e $ENVIRONMENT
          
          echo "✅ Deployment tracked in Sentry"

      - name: Comment on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const sentryOrg = 'studentdeals';
            const sentryProject = 'studentdeals-uz';
            const releaseUrl = `https://sentry.io/organizations/${sentryOrg}/releases/${sha}/?project=${sentryProject}`;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `📊 **Sentry Release Created**\n\nView in Sentry: ${releaseUrl}`
            });

