name: E2E Tests

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: 🏗️ Build web app
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_ENV: staging
          SKIP_ENV_VALIDATION: true

      - name: 🚀 Start preview server
        run: |
          pnpm --filter web start &
          echo "WEB_SERVER_PID=$!" >> $GITHUB_ENV
          sleep 10
        env:
          PORT: 3000

      - name: 🧪 Run Playwright tests
        run: pnpm --filter web run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: 🛑 Stop preview server
        if: always()
        run: |
          if [ -n "$WEB_SERVER_PID" ]; then
            kill $WEB_SERVER_PID || true
          fi

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: 📸 Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  e2e-preview:
    name: E2E on Vercel Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: ⏳ Wait for Vercel Preview
        id: vercel-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          check_interval: 10

      - name: 🧪 Run E2E tests against Preview
        run: pnpm --filter web run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel-preview.outputs.url }}
          CI: true

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview
          path: apps/web/playwright-report/
          retention-days: 7

      - name: 💬 Comment PR with results
        uses: daun/playwright-report-comment@v3
        if: always()
        with:
          report-path: apps/web/playwright-report
          report-url: ${{ steps.vercel-preview.outputs.url }}

