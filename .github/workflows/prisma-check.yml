name: Prisma Schema Check

on:
  pull_request:
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/package.json'
      - '.github/workflows/prisma-check.yml'

jobs:
  prisma-check:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd apps/api
          npm ci

      - name: Validate Prisma schema
        run: |
          cd apps/api
          npm run db:check

      - name: Check for schema changes
        run: |
          cd apps/api
          echo "Checking if schema has uncommitted changes..."
          if ! git diff --quiet prisma/schema.prisma; then
            echo "❌ Prisma schema has uncommitted changes. Please run 'npm run db:check' and commit the formatted schema."
            git diff prisma/schema.prisma
            exit 1
          else
            echo "✅ Prisma schema is properly formatted and committed."
          fi

      - name: Generate Prisma client
        run: |
          cd apps/api
          npx prisma generate

      - name: Check for generated client changes
        run: |
          cd apps/api
          if ! git diff --quiet node_modules/.prisma/client; then
            echo "❌ Prisma client needs to be regenerated. Please run 'npx prisma generate' and commit changes."
            exit 1
          else
            echo "✅ Prisma client is up to date."
          fi

      - name: Test database connection (if DATABASE_URL is available)
        if: env.DATABASE_URL != ''
        run: |
          cd apps/api
          npx prisma db pull --print
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Summary
        run: |
          echo "✅ Prisma schema validation completed successfully!"
          echo "📊 Schema analysis:"
          echo "  - Schema is valid ✅"
          echo "  - Formatting is correct ✅"
          echo "  - Migration diff generated ✅"
          echo "  - Client generation successful ✅"
