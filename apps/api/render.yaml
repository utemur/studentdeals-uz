services:
  - type: web
    name: studentdeals-api
    env: node
    plan: free
    buildCommand: pnpm build && cd apps/api && pnpm prisma migrate deploy && pnpm prisma:seed
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
